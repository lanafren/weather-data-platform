version: 2

models:
  - name: int_weather_unified
    description: >
      Intermediate unified weather data combining current observations and 
      forecast predictions for Berlin. Combines hourly records from both 
      sources with standardized column names and data types.
    meta:
      owner: "analytics_team"
      data_source: "OpenWeatherMap API"
    
    columns:
      - name: record_time_utc
        description: "UTC timestamp of the weather observation or forecast."
        tests:
          - not_null

      - name: record_type
        description: "Record source: 'current' for observed weather, 'forecast' for predictions."
        tests:
          - not_null
          - accepted_values:
              values: ['current', 'forecast']

      - name: sunrise_utc
        description: "Sunrise time in UTC. Only populated for current records, null for forecasts."

      - name: sunset_utc
        description: "Sunset time in UTC. Only populated for current records, null for forecasts."

      - name: temp
        description: "Temperature in degrees Celsius (°C)."

      - name: feels_like
        description: "Perceived temperature accounting for wind chill and humidity, in degrees Celsius (°C)."

      - name: weather_main
        description: "Primary weather condition category (e.g., Clear, Clouds, Rain, Snow)."
        tests:
          - not_null

      - name: weather_description
        description: "Detailed weather condition description (e.g., 'light rain', 'broken clouds')."

      - name: pressure_hpa
        description: "Atmospheric pressure at sea level in hectopascals (hPa)."

      - name: humidity
        description: "Relative humidity percentage (0-100%)."

      - name: visibility_m
        description: "Horizontal visibility distance in meters (m). Maximum value is typically 10000m."

      - name: clouds_pct
        description: "Cloud coverage as percentage of sky (0-100%)."

      - name: wind_speed
        description: "Wind speed in meters per second (m/s)."

      - name: wind_deg
        description: "Wind direction in meteorological degrees (0-360°). 0° = North, 90° = East, 180° = South, 270° = West."

      - name: wind_gust
        description: "Wind gust speed in meters per second (m/s). Null when no gusts recorded."

      - name: rain_mm
        description: >
          Precipitation volume in millimeters (mm). 
          For current records: 1-hour accumulation.
          For forecast records: 3-hour accumulation.
          Null when no rain detected.

      - name: snow_mm
        description: >
          Snow volume in millimeters (mm).
          For current records: 1-hour accumulation.
          For forecast records: 3-hour accumulation.
          Null when no snow detected.

      - name: is_raining
        description: "Boolean flag: true if rain is occurring/forecasted, false otherwise."
        tests:
          - not_null

      - name: is_snowing
        description: "Boolean flag: true if snow is occurring/forecasted, false otherwise."
        tests:
          - not_null

      - name: fetched_at
        description: "UTC timestamp when this data was fetched from the OpenWeatherMap API."
        tests:
          - not_null

      - name: loaded_at
        description: "UTC timestamp when this record was loaded into the data warehouse by dbt."