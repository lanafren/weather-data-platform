version: 2

models:
  - name: int_weather_flat
    description: "Intermediate flattened weather fact table for Berlin with hourly observations and weather metrics."
    columns:

      - name: record_time_utc
        description: "Timestamp of the weather observation."
        tests:
          - not_null

      - name: record_type
        description: "Type of record, currently 'current'."
        tests:
          - not_null

      - name: sunrise_utc
        description: "Sunrise time for Berlin."

      - name: sunset_utc
        description: "Sunset time for Berlin."

      - name: temp
        description: "Observed temperature in Celsius."

      - name: feels_like
        description: "Perceived temperature in Celsius."

      - name: weather_main
        description: "Main weather condition (e.g., Clear, Rain, Snow)."

      - name: weather_description
        description: "Detailed weather description."

      - name: pressure_hpa
        description: "Atmospheric pressure in hPa."

      - name: humidity
        description: "Humidity percentage."

      - name: visibility_m
        description: "Visibility in meters."

      - name: clouds_pct
        description: "Cloud coverage percentage."

      - name: wind_speed
        description: "Wind speed in m/s."

      - name: wind_deg
        description: "Wind direction in degrees."
      - name: wind_gust
        description: "Wind gust speed in m/s."

      - name: rain_mm
        description: "Rain volume in last 1 hour in mm."

      - name: snow_mm
        description: "Snow volume in last 1 hour in mm."

      - name: is_raining
        description: "Boolean flag indicating if it is raining."

      - name: is_snowing
        description: "Boolean flag indicating if it is snowing."

      - name: fetched_at
        description: "Timestamp when this record was fetched from source."
        tests:
          - not_null
